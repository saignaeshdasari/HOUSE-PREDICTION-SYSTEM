<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PropZen - House Price Predictor</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      border: none;
      border-radius: 20px;
      backdrop-filter: blur(15px);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      color: white;
      padding: 20px;
    }

    .card-header {
      background: transparent;
      border-bottom: none;
      text-align: center;
      padding-bottom: 0;
    }

    h1 {
      font-weight: 700;
      font-size: 28px;
    }

    label {
      font-weight: 500;
      margin-bottom: 6px;
    }

    .form-control, .form-select {
      border-radius: 10px;
      border: none;
      padding: 10px;
    }

    .form-control:focus {
      box-shadow: 0 0 10px rgba(255,255,255,0.4);
    }

    .btn-custom {
      background: linear-gradient(45deg, #ff512f, #dd2476);
      border: none;
      border-radius: 30px;
      padding: 10px 30px;
      font-weight: 600;
      transition: 0.3s ease;
      color: white;
    }

    .btn-custom:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

  </style>
</head>

<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">

      <div class="card">
        <div class="card-header">
          <h1>🏠 PropZen</h1>
          <p>Welcome to House Price Predictor - Banglore</p>
        </div>

        <div class="card-body">
          <form method="post" accept-charset="utf-8">

            <div class="row g-3">

              <div class="col-md-6">
                <label>Select Location</label>
                <select class="form-select" id="location" name="location" required>
                    {% for location in locations %}
                  <option value="{{location}}">{{location}}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-md-6">
                <label>Enter BHK</label>
                <input type="number" class="form-control" id="bhk" name="bhk" placeholder="Number of bedrooms">
              </div>

              <div class="col-md-6">
                <label>Enter Bathrooms</label>
                <input type="number" class="form-control" id="bath" name="bath" placeholder="Number of bathrooms">
              </div>

              <div class="col-md-6">
                <label>Total Square Feet</label>
                <input type="number" class="form-control" id="total_sqft" name="total_sqft" placeholder="Total area in sqft">
              </div>

              <div class="col-12 text-center mt-4">
                <button type="submit" class="btn btn-custom" onclick="send_data()">
                  🔮 Predict Price
                </button>
              </div>

            </div>
          </form>

          <div class="result-box" style=" margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      color: #fff">
          <h3><span id="prediction"></span></h3>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>

<script>
document.querySelector("form").addEventListener("submit", function(e) {

    e.preventDefault(); 

    var fd = new FormData(this);

    var xhr = new XMLHttpRequest();

    xhr.open("POST", "/predict", true);
     document.getElementById("prediction").innerHTML = "Wait Predicting Price!...";
    
     xhr.onreadystatechange = function(){
        if(xhr.readyState == XMLHttpRequest.DONE){
            document.getElementById('prediction').innerHTML = "Prediction: ₹"+xhr.responseText;
        }
     };
     xhr.onload = function(){};
     xhr.send(fd);

});
</script>
